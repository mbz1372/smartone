services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartone
      POSTGRES_USER: smartone
      POSTGRES_PASSWORD: smartone
    ports:
      - "5432:5432"
    volumes:
      - smartone_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartone -d smartone"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smartone_pg:
